version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sherlock-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    # 开发模式挂载代码卷，实现热重载（需配合 --reload 启动）
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - sherlock-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sherlock-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sherlock-network

networks:
  sherlock-network:
    driver: bridge
