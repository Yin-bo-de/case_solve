version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sherlock-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # 生产环境不挂载代码卷
    # 使用 Dockerfile 中定义的启动命令（无 --reload）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./log:/app/logs
      - ./backend/data:/app/data
    networks:
      - sherlock-network-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sherlock-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    networks:
      - sherlock-network-prod
    volumes:
      - caddy-data:/data
      - caddy-config:/config

networks:
  sherlock-network-prod:
    driver: bridge

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
